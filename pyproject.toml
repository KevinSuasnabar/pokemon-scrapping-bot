[project]
name = "pokemon-tcg-offer-tracker"
version = "0.1.0"
description = "Tracks Pokemon TCG 30th Anniversary English-variant offers across Peruvian storefronts."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx[brotli]>=0.27",
    "selectolax>=0.3",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
ripley = [
    "playwright>=1.42",
    "playwright-stealth>=2.0",
    "pytest-playwright>=0.5",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
tracker = "tracker.cli.main:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: hits a real third-party network endpoint; excluded by default",
    "playwright: requires Playwright browser binaries; excluded by default",
]
addopts = "-m \"not live and not playwright\""

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["tracker"]
mypy_path = "src"
